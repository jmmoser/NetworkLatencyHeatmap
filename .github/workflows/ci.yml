name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both platforms matter: the poller (epoll vs kqueue) and the
        # SO_TIMESTAMP cmsg layout differ between Linux and macOS
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
      - name: Run unit tests
        run: zig build test
